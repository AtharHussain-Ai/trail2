<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMAC Properties</title>

  <link rel="icon" href="assets/headerlogo.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="glass-layer"></div>

  <div class="logo">
    <img src="assets/logo.png" alt="DAMAC">
  </div>

  <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#">About Us</a>
    <a href="#">Service</a>
    <a href="#">Testimonial</a>
  </nav>

  <button class="menu-btn">MENU</button>
</header>

<section class="hero">

  <video class="hero-video" autoplay muted loop playsinline>
    <source src="assets/dubai_home.mp4" type="video/mp4">
  </video>

  <div class="hero-overlay"></div>

  <div class="hero-top">
    <h1>
      EXCLUSIVE LUXURY<br>
      PROPERTIES IN<br>
      DUBAI.
    </h1>
  </div>

  <div class="hero-bottom">

    <div class="hero-left">
      <p>
        CHOOSE FROM A RANGE OF APARTMENTS, VILLAS AND TOWNHOUSES
      </p>

      <!-- PREMIUM CTA BUTTON -->
      <button class="button hero-cta" style="--clr: #7808d0">
        <span class="button__icon-wrapper">
          <svg viewBox="0 0 14 15" class="button__icon-svg" width="10">
            <path
              d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28
              6.96-.048L.2 12.56l1.488 1.488
              9.432-9.432-.048 6.912 2.304.024z"
              fill="currentColor"
            />
          </svg>

          <svg viewBox="0 0 14 15"
            class="button__icon-svg button__icon-svg--copy"
            width="10">
            <path
              d="M13.376 11.552l-.264-10.44-10.44-.24.024 2.28
              6.96-.048L.2 12.56l1.488 1.488
              9.432-9.432-.048 6.912 2.304.024z"
              fill="currentColor"
            />
          </svg>
        </span>
        Get Started
      </button>
    </div>

    <div class="hero-stats">
      <div class="stat">
        <h3>INR 1.7 Crores*</h3>
        <span>Starting price</span>
      </div>

      <div class="stat">
        <h3>8–10%**</h3>
        <span>High rental returns</span>
      </div>
    </div>

  </div>

</section>

</body>
</html>
